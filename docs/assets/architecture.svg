<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc"><title id="title">WireWarp architecture</title><desc id="desc">Ordered pipeline with graph-specialized simulation and lossless IPC.</desc><g font-family="system-ui,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="800" height="580" rx="12" fill="#101923"/><text x="30" y="41" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start">WireWarp | Ordered execution pipeline</text><text x="30" y="68" font-size="14" fill="#9cacc0" font-weight="400" text-anchor="start">V4.1 engine retained in V4.2 · graph-bound specialization · lossless IPC</text><rect x="105" y="91" width="590" height="52" rx="5" fill="#1d3344"/><text x="400" y="112" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle">Terraria frontend</text><text x="400" y="131" font-size="13" fill="#b8c9d6" font-weight="400" text-anchor="middle">Capture inputs • existing tick schedule</text><path d="M400 143 v15 l-5 -5 m5 5 l5 -5" fill="none" stroke="#9cacc0" stroke-width="2"/><rect x="105" y="161" width="590" height="52" rx="5" fill="#1d3344"/><text x="400" y="182" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle">Named-pipe request</text><text x="400" y="201" font-size="13" fill="#b8c9d6" font-weight="400" text-anchor="middle">Ordered input activations</text><path d="M400 213 v15 l-5 -5 m5 5 l5 -5" fill="none" stroke="#9cacc0" stroke-width="2"/><rect x="105" y="231" width="590" height="52" rx="5" fill="#1d3344"/><text x="400" y="252" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle">macha backend</text><text x="400" y="271" font-size="13" fill="#b8c9d6" font-weight="400" text-anchor="middle">V3.5 wire plans • V4.0 packed gate evaluation</text><path d="M400 283 v15 l-5 -5 m5 5 l5 -5" fill="none" stroke="#9cacc0" stroke-width="2"/><rect x="105" y="301" width="590" height="52" rx="5" fill="#194a40"/><text x="400" y="322" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle">V4.1 continuation queue</text><text x="400" y="341" font-size="13" fill="#b8c9d6" font-weight="400" text-anchor="middle">Ordered 1–3 wires or original list • next wave only</text><path d="M400 353 v15 l-5 -5 m5 5 l5 -5" fill="none" stroke="#9cacc0" stroke-width="2"/><rect x="105" y="371" width="590" height="52" rx="5" fill="#1d3344"/><text x="400" y="392" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle">Compact16 / original RLE</text><text x="400" y="411" font-size="13" fill="#b8c9d6" font-weight="400" text-anchor="middle">Lossless response • fallback for large IDs / repeats</text><path d="M400 423 v15 l-5 -5 m5 5 l5 -5" fill="none" stroke="#9cacc0" stroke-width="2"/><rect x="105" y="441" width="590" height="52" rx="5" fill="#1d3344"/><text x="400" y="462" font-size="17" fill="#e2e8f0" font-weight="700" text-anchor="middle">Terraria frontend</text><text x="400" y="481" font-size="13" fill="#b8c9d6" font-weight="400" text-anchor="middle">Ordered device application • native behavior retained</text><text x="30" y="535" font-size="14" fill="#9cacc0" font-weight="400" text-anchor="start">SHA-256 mismatch → generic backend. No tick merging or cross-wave fusion.</text><text x="30" y="557" font-size="14" fill="#9cacc0" font-weight="400" text-anchor="start">Fast frontend starts automatically; native campfires default; reference selectable.</text></g></svg>
