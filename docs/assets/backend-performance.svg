<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title desc"><title id="title">Mixed RGB backend benchmark</title><desc id="desc">RC2 nine-mode comparison with historical RC1 peak.</desc><g font-family="system-ui,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="800" height="530" rx="12" fill="#101923"/><text x="30" y="41" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start">WireWarp | Mixed RGB backend</text><text x="30" y="68" font-size="14" fill="#9cacc0" font-weight="400" text-anchor="start">RC2 · 1,000 events · 7 rounds · median ms/event (lower is better)</text><text x="30" y="110" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">generic</text><rect x="125" y="91" width="510" height="23" rx="5" fill="#202d3b"/><rect x="125" y="91" width="506.67024638405286" height="23" rx="5" fill="#70869c"/><text x="651" y="109" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start">4.134</text><text x="30" y="147" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">v2</text><rect x="125" y="128" width="510" height="23" rx="5" fill="#202d3b"/><rect x="125" y="128" width="510.0" height="23" rx="5" fill="#4c90d3"/><text x="651" y="146" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start">4.161</text><text x="30" y="184" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">v3</text><rect x="125" y="165" width="510" height="23" rx="5" fill="#202d3b"/><rect x="125" y="165" width="274.1653418467881" height="23" rx="5" fill="#4c90d3"/><text x="651" y="183" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start">2.237</text><text x="30" y="221" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">v3.1</text><rect x="125" y="202" width="510" height="23" rx="5" fill="#202d3b"/><rect x="125" y="202" width="133.66249862110584" height="23" rx="5" fill="#4c90d3"/><text x="651" y="220" font-size="16" fill="#e2e8f0" font-weight="400