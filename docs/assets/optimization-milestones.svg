<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 645" role="img" aria-labelledby="title desc"><title id="title">Optimization milestones</title><desc id="desc">Version milestones with scoped structural improvements.</desc><g font-family="system-ui,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="800" height="645" rx="12" fill="#101923"/><text x="30" y="41" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start">WireWarp | Optimization milestones</text><text x="30" y="68" font-size="14" fill="#9cacc0" font-weight="400" text-anchor="start">Architecture improvements · measured claims scoped to tested workloads</text><rect x="30" y="91" width="118" height="45" rx="5" fill="#1d3344"/><text x="89" y="118" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V3.1</text><text x="166" y="108" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Lazy control parity</text><text x="166" y="127" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">Deferred redundant control writes; original wave semantics.</text><rect x="30" y="148" width="118" height="45" rx="5" fill="#1d3344"/><text x="89" y="175" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V3.2</text><text x="166" y="165" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Selective trigger masks</text><text x="166" y="184" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">98.62% of mask-block storage avoided on the RGB graph.</text><rect x="30" y="205" width="118" height="45" rx="5" fill="#1d3344"/><text x="89" y="232" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V3.5</text><text x="166" y="222" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Compiled wire execution</text><text x="166" y="241" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">128,407 / 131,748 wires eligible in RC2 RGB.</text><rect x="30" y="262" width="118" height="45" rx="5" fill="#1d3344"/><text x="89" y="289" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V3.6–7</text><text x="166" y="279" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Indexed / compiled frontend</text><text x="166" y="298" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">Direct dispatch, reusable buffers, reduced allocations.</text><rect x="30" y="319" width="118" height="45" rx="5" fill="#1d3344"/><text x="89" y="346" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V3.8</text><text x="166" y="336" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Compact IPC</text><text x="166" y="355" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">2 vs 8 bytes per eligible singleton record (75% smaller).</text><rect x="30" y="376" width="118" height="45" rx="5" fill="#1d3344"/><text x="89" y="403" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V3.9</text><text x="166" y="393" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Device specialization</text><text x="166" y="412" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">Ordered chimney and legacy campfire writes; native fallback.</text><rect x="30" y="433" width="118" height="45" rx="5" fill="#1d3344"/><text x="89" y="460" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V4.0</text><text x="166" y="450" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Packed gate descriptors</text><text x="166" y="469" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">8 bytes per descriptor; 327,611 gates eligible in RGB.</text><rect x="30" y="490" width="118" height="45" rx="5" fill="#1d3344"/><text x="89" y="517" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V4.1</text><text x="166" y="507" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Wave-local continuations</text><text x="166" y="526" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">8 vs 16 bytes per eligible x64 queue record; ordered fallback.</text><rect x="30" y="547" width="118" height="45" rx="5" fill="#194a40"/><text x="89" y="574" font-size="14" fill="#e2e8f0" font-weight="700" text-anchor="middle">V4.2</text><text x="166" y="564" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Release and startup</text><text x="166" y="583" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">Validated setup/launch, fast default and graph-mismatch fallback.</text><text x="30" y="622" font-size="13" fill="#9cacc0" font-weight="400" text-anchor="start">Structural storage/encoding improvements do not equal total RAM or FPS savings.</text></g></svg>
